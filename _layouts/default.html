<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% if page.title %}{{ page.title }} — Tony Arthur{% else %}Tony Arthur{% endif %}</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
    <meta name="author" content="Tony Arthur">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}Tony Arthur{% endif %}">
    <meta property="og:description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
    <meta property="og:image" content="{{ site.url }}/img/tony.jpeg">

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="alternate icon" href="/favicon.ico">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/blog.css">
</head>
<body>
    <nav class="nav" id="nav" aria-label="Main navigation">
        <a href="/" class="logo" aria-label="Tony Arthur - Home">Tony Arthur</a>
        <div class="nav-links">
            <a href="/blog/">Blog</a>
            <a href="https://www.linkedin.com/in/tonyarthur" target="_blank" rel="noopener">LinkedIn</a>
            <a href="https://github.com/iamtonyarthur" target="_blank" rel="noopener">GitHub</a>
        </div>
    </nav>

    <main class="blog-main">
        {{ content }}
    </main>

    <footer class="footer dark">
        <span class="footer-text">Tony Arthur — Security & Software Engineering Leader</span>
    </footer>

    <script src="/script.js"></script>
</body>
</html>
