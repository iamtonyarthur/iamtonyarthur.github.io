---
layout: default
---
<article class="post">
    <div class="post-header">
        <a class="post-back" href="/blog/">← All posts</a>
        <p class="eyebrow accent-blue">{{ page.date | date: "%B %-d, %Y" }}</p>
        <h1 class="post-title">{{ page.title }}</h1>
        {% if page.tags.size > 0 %}
        <div class="post-tags">
            {% for tag in page.tags %}<span class="tag-chip small">{{ tag }}</span>{% endfor %}
        </div>
        {% endif %}
    </div>
    <div class="post-content">
        {{ content }}
    </div>
</article>
